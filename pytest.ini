[pytest]
# PI3 Plant Edition - Flexible Foam
# Permanent automated regression suite. See tests/README.md.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The application modules sit at the repository root and are imported flat
# (import db, import access_control). This puts the root on sys.path so the
# suite runs the same way from any directory.
pythonpath = .

addopts =
    --strict-markers
    --strict-config
    -ra
    --tb=short

markers =
    postgres: needs a real PostgreSQL named by PI3_TEST_DB_URL. Mandatory for a technical release - a release return may not report a clean mandatory suite if these were skipped.
    slow: takes long enough that a developer may want to exclude it locally.

filterwarnings =
    default
    # The check modules moved in from the pre-CR scripts read source files with
    # open(...).read() and never close them. Harmless - read-only, and the
    # process is short-lived - but it produces a wall of ResourceWarnings that
    # would bury anything worth reading. This line goes away as each module is
    # rewritten as ordinary pytest tests in work packages 3 to 8.
    ignore::ResourceWarning
